name: fittrack
description: "A production-grade personal fitness journal and visual transformation tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking
  http: ^1.2.1

  # Camera & Media
  camera: ^0.11.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Utilities & Storage
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # Icons & Styling
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
